name: Daily Brand Sales Scraper & Radar

on:
  schedule:
    # Runs daily at 05:00 UTC (10:00 AM Pakistan Standard Time)
    - cron: '0 5 * * *'
  # Allows you to manually trigger the scraper anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Store Catalog Scraper
        run: node scripts/scrape-sales.mjs

      - name: Commit and Push Updated Sales Data
        run: |
          git config --global user.name "BrandGali Sales Radar Bot"
          git config --global user.email "bot@brandgali.com"
          git add brands-data.js public/daily-sales-feed.json
          if git diff --staged --quiet; then
            echo "No changes in sales catalogs today."
          else
            git commit -m "Auto-update: Daily Pakistani brand sales radar [skip ci]"
            git push origin main
          fi
