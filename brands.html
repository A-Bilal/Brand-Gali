<script>

<script>
function syncBottomNavForCategories(){
  const brandsLink = document.querySelector('.bottom-nav a[href="brands.html"]');
  const catLink = document.querySelector('.bottom-nav a[href="brands.html#categories"]');
  if(!catLink) return;
  if(window.location.hash === '#categories'){
    if(brandsLink) brandsLink.classList.remove('active');
    catLink.classList.add('active');
  } else {
    catLink.classList.remove('active');
    if(brandsLink) brandsLink.classList.add('active');
  }
}
window.addEventListener('hashchange', syncBottomNavForCategories);

function renderDrawerCategories(){
  const el = document.getElementById('drawerCategories');
  if(!el) return;
  el.innerHTML = CATEGORIES.map(cat => {
    const count = BRANDS.filter(b => b.category === cat.name).length;
    return `<h4>${cat.name}</h4><ul><li><a href="brands.html?category=${encodeURIComponent(cat.name)}">View all ${cat.name} (${count}) &rarr;</a></li></ul>`;
  }).join('');
}

function wireDrawerAndSearch(){
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const openDrawer = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
  const closeDrawer = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };
  document.getElementById('moreNavBtn')?.addEventListener('click', (e) => { e.preventDefault(); openDrawer(); });
  document.getElementById('menuBtn')?.addEventListener('click', openDrawer);
  document.getElementById('drawerClose')?.addEventListener('click', closeDrawer);
  backdrop?.addEventListener('click', closeDrawer);

  const overlay = document.getElementById('searchOverlay');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  const openSearch = () => { overlay.classList.add('open'); input.value=''; results.innerHTML=''; input.focus(); };
  const closeSearch = () => { overlay.classList.remove('open'); };
  document.getElementById('searchBtn')?.addEventListener('click', () => window.openSearchOverlay(''));
}

function getBrandMaxDiscount(b) {
  let max = 0;
  const text = [(b.live && b.live.off) || '', (b.sale && b.sale.headline) || ''].join(' ');
  const m = text.match(/(\d+)%/);
  if (m) max = Math.max(max, parseInt(m[1], 10));
  if (b.sale && Array.isArray(b.sale.products)) {
    b.sale.products.forEach(p => {
      const pText = [p.discount || '', p.currentPrice || '', p.originalPrice || ''].join(' ');
      const pm = pText.match(/(\d+)%/);
      if (pm) max = Math.max(max, parseInt(pm[1], 10));
    });
  }
  return max;
}

function getBrandMinPrice(b) {
  let min = 999999;
  if (b.sale && Array.isArray(b.sale.products)) {
    b.sale.products.forEach(p => {
      if (p.currentPrice) {
        const val = parseInt(p.currentPrice.replace(/[^0-9]/g, ''), 10);
        if (val && !isNaN(val)) min = Math.min(min, val);
      }
    });
  }
  return min === 999999 ? 4500 : min;
}

function parseFilterFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const filter = (params.get('filter') || params.get('collection') || params.get('status') || '').toLowerCase().trim();
  const cat = params.get('category');
  
  if (filter === 'featured' || filter === 'top-picks' || filter === 'toppicks' || filter === 'popular' || params.get('featured') === 'true') {
    return { type: 'featured', id: 'featured' };
  }
  if (filter === 'new' || filter === 'fresh' || filter === 'fresh-drops' || filter === 'new-arrivals') {
    return { type: 'new', id: 'new' };
  }
  if (filter === 'sale' || filter === 'live' || filter === 'on-sale' || filter === 'sales') {
    return { type: 'sale', id: 'sale' };
  }
  if (filter === 'flat50' || filter === '50off' || filter === 'flat-50') {
    return { type: 'flat50', id: 'flat50' };
  }
  if (filter === 'min30' || filter === '30off' || filter === 'min-30') {
    return { type: 'min30', id: 'min30' };
  }
  if (filter === 'under3000' || filter === 'under-3000') {
    return { type: 'under3000', id: 'under3000' };
  }
  if (cat && cat !== 'All') {
    return { type: 'category', id: `cat_${cat}`, value: cat };
  }
  if (filter) {
    const matchingCat = CATEGORIES.find(c => c.name.toLowerCase() === filter);
    if (matchingCat) {
      return { type: 'category', id: `cat_${matchingCat.name}`, value: matchingCat.name };
    }
  }
  return { type: 'all', id: 'all' };
}

let activeFilter = parseFilterFromUrl();
let currentBrandSort = 'alpha';

function getFilteredBrands(filter){
  let list = BRANDS.slice();
  if (filter.type === 'featured') {
    list = list.filter(b => b.featured);
  } else if (filter.type === 'new') {
    list = list.filter(b => b.status === 'new');
  } else if (filter.type === 'sale') {
    list = list.filter(b => b.status === 'sale');
  } else if (filter.type === 'flat50') {
    list = list.filter(b => getBrandMaxDiscount(b) >= 50);
  } else if (filter.type === 'min30') {
    list = list.filter(b => getBrandMaxDiscount(b) >= 30);
  } else if (filter.type === 'under3000') {
    list = list.filter(b => getBrandMinPrice(b) <= 3000);
  } else if (filter.type === 'category') {
    list = list.filter(b => b.category === filter.value);
  }

  // Sort
  if (currentBrandSort === 'discount') {
    list.sort((a, b) => getBrandMaxDiscount(b) - getBrandMaxDiscount(a));
  } else if (currentBrandSort === 'featured') {
    list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  } else if (currentBrandSort === 'new') {
    list.sort((a, b) => (b.status === 'new' ? 1 : 0) - (a.status === 'new' ? 1 : 0));
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }

  return list;
}

function updatePageHeader(filter, count){
  const titleEl = document.getElementById('sectionTitleText');
  const iconEl = document.getElementById('sectionIcon');
  const countEl = document.getElementById('brandCount');

  let title = 'All Brands';
  let iconClass = 'fa-solid fa-shop';

  if (filter.type === 'featured') {
    title = 'Featured Brands';
    iconClass = 'fa-solid fa-star';
  } else if (filter.type === 'new') {
    title = 'Fresh Drops';
    iconClass = 'fa-solid fa-sparkles';
  } else if (filter.type === 'sale') {
    title = 'Brands On Sale';
    iconClass = 'fa-solid fa-fire';
  } else if (filter.type === 'flat50') {
    title = 'Flat 50% Off Deals';
    iconClass = 'fa-solid fa-fire';
  } else if (filter.type === 'min30') {
    title = '30%+ Discount Deals';
    iconClass = 'fa-solid fa-tag';
  } else if (filter.type === 'under3000') {
    title = 'Under PKR 3,000 Picks';
    iconClass = 'fa-solid fa-wallet';
  } else if (filter.type === 'category') {
    title = `${filter.value} Brands`;
    const icons = {'Clothing':'fa-shirt','Footwear':'fa-shoe-prints','Home Décor':'fa-couch','Lifestyle':'fa-star','Kitchen & Accessories':'fa-kitchen-set','Bags':'fa-bag-shopping'};
    iconClass = `fa-solid ${icons[filter.value] || 'fa-tag'}`;
  }

  if (titleEl) titleEl.textContent = title;
  if (iconEl) iconEl.className = iconClass;
  if (countEl) countEl.textContent = `${count} brand${count === 1 ? '' : 's'}`;
}

window.resetToAllBrands = function(){
  activeFilter = { type: 'all', id: 'all' };
  const url = new URL(window.location.href);
  url.searchParams.delete('filter');
  url.searchParams.delete('category');
  url.searchParams.delete('collection');
  url.searchParams.delete('status');
  window.history.replaceState({}, '', url.pathname);
  renderFilters();
  applyGridRender(true);
};

function renderFilters(){
  const row = document.getElementById('filterRow');
  if(!row) return;

  const featuredCount = BRANDS.filter(b => b.featured).length;
  const newCount = BRANDS.filter(b => b.status === 'new').length;
  const saleCount = BRANDS.filter(b => b.status === 'sale').length;
  const flat50Count = BRANDS.filter(b => getBrandMaxDiscount(b) >= 50).length;

  const filterOptions = [
    { id: 'all', type: 'all', label: `All (${BRANDS.length})` },
    { id: 'featured', type: 'featured', label: `⭐ Featured (${featuredCount})` },
    { id: 'new', type: 'new', label: `✨ Fresh Drops (${newCount})` },
    { id: 'sale', type: 'sale', label: `🔥 On Sale (${saleCount})` },
    { id: 'flat50', type: 'flat50', label: `💥 Flat 50% (${flat50Count})` },
    { id: 'min30', type: 'min30', label: `🏷️ 30%+ Off` },
    { id: 'under3000', type: 'under3000', label: `💵 Under PKR 3,000` },
    ...CATEGORIES.map(c => {
      const cCount = BRANDS.filter(b => b.category === c.name).length;
      return { id: `cat_${c.name}`, type: 'category', value: c.name, label: `${c.name} (${cCount})` };
    })
  ];

  row.innerHTML = filterOptions.map(opt => {
    const isActive = opt.id === activeFilter.id;
    return `<button class="filter-chip${isActive ? ' active' : ''}" data-filter-id="${opt.id}" type="button">${opt.label}</button>`;
  }).join('');

  row.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const selectedId = btn.dataset.filterId;
      const selectedOpt = filterOptions.find(o => o.id === selectedId);
      if (!selectedOpt) return;

      activeFilter = selectedOpt;

      const url = new URL(window.location.href);
      url.searchParams.delete('filter');
      url.searchParams.delete('category');
      url.searchParams.delete('collection');
      url.searchParams.delete('status');

      if (activeFilter.type === 'featured') {
        url.searchParams.set('filter', 'featured');
      } else if (activeFilter.type === 'new') {
        url.searchParams.set('filter', 'new');
      } else if (activeFilter.type === 'sale') {
        url.searchParams.set('filter', 'sale');
      } else if (activeFilter.type === 'flat50') {
        url.searchParams.set('filter', 'flat50');
      } else if (activeFilter.type === 'min30') {
        url.searchParams.set('filter', 'min30');
      } else if (activeFilter.type === 'under3000') {
        url.searchParams.set('filter', 'under3000');
      } else if (activeFilter.type === 'category') {
        url.searchParams.set('category', activeFilter.value);
      }
      window.history.replaceState({}, '', url.toString());

      renderFilters();
      applyGridRender(true);
      btn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    });
  });
}

function applyGridRender(withSkeleton = false) {
  const grid = document.getElementById('brandGrid');
  if (withSkeleton && grid && window.renderSkeletonCardsHTML) {
    grid.innerHTML = window.renderSkeletonCardsHTML(6);
    setTimeout(() => {
      renderGrid();
    }, 150);
  } else {
    renderGrid();
  }
}

function renderGrid(){
  const grid = document.getElementById('brandGrid');
  const list = getFilteredBrands(activeFilter);
  updatePageHeader(activeFilter, list.length);

  if (list.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px;">
        <div style="font-size: 32px; margin-bottom: 8px;">🔍</div>
        <h3 style="font-family:'Poppins';font-weight:700;color:var(--navy);font-size:16px;margin:0 0 6px;">No brands found</h3>
        <p style="font-size:13px;color:var(--muted);margin:0 0 16px;">There are no brands matching this selection currently.</p>
        <button class="btn" type="button" onclick="resetToAllBrands()" style="display:inline-block;padding:8px 18px;">Show All Brands (${BRANDS.length})</button>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(b => {
    const hasSale = b.status === 'sale' || Boolean(b.live);
    const chip = b.status === 'sale' ? `<span class="status-chip sale" onclick="openBrandSaleModal('${b.id}')" role="button" tabindex="0" style="cursor:pointer;" title="View ${b.name} live sale on BrandGali"><i class="fa-solid fa-fire"></i> Sale Live</span>` : b.status === 'new' ? '<span class="status-chip new">New</span>' : '';
    const cardStyle = chip ? ' style="padding-top:34px;"' : '';
    const timelinessBadge = b.status === 'sale' && window.renderDealTimelinessBadge ? `<div style="margin-bottom:8px;">${window.renderDealTimelinessBadge(b)}</div>` : '';
    const actionBtn = `<button class="btn" type="button" onclick="openBrandSaleModal('${b.id}')" title="View ${b.name} sales & discounts" style="${hasSale ? 'background:var(--orange);color:#fff;' : 'background:#EDE8DF;color:var(--navy);'}"><i class="fa-solid ${hasSale ? 'fa-fire' : 'fa-tags'}"></i> ${hasSale ? 'View Sale Deals' : 'Check Sales'}</button>`;
    return `<div class="brand-grid-card"${cardStyle}>
      ${chip}
      <div class="top-row" onclick="openBrandSaleModal('${b.id}')" style="cursor:pointer;" title="Click to view ${b.name} sales happening">
        ${brandBadgeHTML(b, 44)}
        <div><div class="name">${b.name}</div><div class="cat">${b.category} &bull; ${b.priceRange || 'Retail'}</div></div>
      </div>
      ${timelinessBadge}
      <div class="card-actions">
        ${actionBtn}
        ${notifyButtonHTML(b)}
      </div>
    </div>`;
  }).join('');

  wireNotifyButtons();
  refreshNotifyButtonsUI();
}

function wireSortControl() {
  const select = document.getElementById('brandSortSelect');
  if (select) {
    select.addEventListener('change', (e) => {
      currentBrandSort = e.target.value;
      applyGridRender(true);
    });
  }
}

window.addEventListener('popstate', () => {
  activeFilter = parseFilterFromUrl();
  renderFilters();
  applyGridRender(true);
});

let isBrandsPageInitialized = false;
function initBrandsPage() {
  const getSalesStatus = (typeof loadSalesStatus === 'function')
    ? loadSalesStatus
    : (typeof window.loadSalesStatus === 'function' ? window.loadSalesStatus : () => Promise.resolve(window.BRANDS || []));

  getSalesStatus().then(() => {
    renderFilters();
    wireSortControl();
    renderGrid();
    renderDrawerCategories();
    wireDrawerAndSearch();
    wireNotifyButtons();
    refreshNotifyButtonsUI();
    syncBottomNavForCategories();
    isBrandsPageInitialized = true;
  }).catch((err) => {
    console.warn('BrandGali Brands initialization warning:', err);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initBrandsPage);
} else {
  initBrandsPage();
}

window.addEventListener('brandgali:data-ready', () => {
  initBrandsPage();
});
</script>
